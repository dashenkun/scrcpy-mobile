name: Build and Publish Unsigned IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja meson ffmpeg go

      - name: Build host protobuf 3.19.4 for adb-mobile
        run: |
          curl -fsSL -o /tmp/pb.tar.gz https://github.com/protocolbuffers/protobuf/releases/download/v3.19.4/protobuf-all-3.19.4.tar.gz
          tar xzf /tmp/pb.tar.gz -C /tmp
          cd /tmp/protobuf-3.19.4
          ./configure --prefix=/tmp/protobuf-install --disable-shared
          make -j4
          make install
          echo "/tmp/protobuf-install/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=/tmp/protobuf-install" >> "$GITHUB_ENV"
          /tmp/protobuf-install/bin/protoc --version

      - name: Cache native libraries
        uses: actions/cache@v4
        id: cache-libs
        with:
          path: |
            output
            external/adb-mobile/output
          key: ${{ runner.os }}-libs-v1

      - name: Set up JDK 11 for scrcpy-server
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch protobuf branches for adb-mobile
        run: git -C external/adb-mobile/external/protobuf fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Free disk space
        run: |
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData || true
          sudo rm -rf ~/Library/Caches/Homebrew/downloads/*.tar.gz || true
          df -h /

      - name: Build native libraries
        if: steps.cache-libs.outputs.cache-hit != 'true'
        env:
          CMAKE_POLICY_VERSION_MINIMUM: 3.5
        run: make libs

      - name: Build unsigned IPA
        run: |
          cd scrcpy-ios
          xcodebuild archive \
            -project scrcpy-ios.xcodeproj \
            -scheme scrcpy-ios \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/scrcpy-ios.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/scrcpy-ios.xcarchive/Products/Applications/scrcpy-ios.app" \
            "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -r scrcpy-ios-unsigned.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-ios-unsigned
          path: ${{ runner.temp }}/scrcpy-ios-unsigned.ipa

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/scrcpy-ios-unsigned.ipa
